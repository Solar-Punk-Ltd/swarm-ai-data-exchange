<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalog Browser</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Catalog Browser</h1>
      <span>Browse and purchase items from a Swarm catalog feed</span>
      <span id="count-badge" class="count-badge" hidden></span>
    </header>

    <div class="config-bar">
      <div class="config-bar-top">
        <button class="btn-settings-toggle" id="settings-toggle" onclick="_toggleSettings()">
          ⚙ Settings
        </button>
        <button id="load-btn" class="btn-primary">Load Catalog</button>
      </div>
      <div id="settings-panel" class="settings-panel">
        <div class="field" style="flex: 1.5">
          <label for="feed-owner">Feed Owner</label>
          <input id="feed-owner" type="text" placeholder="Swarm address (hex)" spellcheck="false" />
        </div>
        <div class="field" style="flex: 2.2">
          <label for="feed-topic">Feed Topic</label>
          <input id="feed-topic" type="text" placeholder="Topic hash (hex)" spellcheck="false" />
        </div>
        <div class="field" style="flex: 2.2">
          <label for="server-url">x402 Server URL</label>
          <input id="server-url" type="text" placeholder="http://localhost:3000" />
        </div>
      </div>
    </div>

    <main>
      <div id="status" class="status">Enter feed details above and click Load Catalog.</div>
      <div id="catalog-meta" class="catalog-meta" hidden></div>
      <div id="grid" class="grid" hidden></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
