[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 1000
# Clones are deployed per seller, so the implementation's runtime size is irrelevant to
# per-clone gas — optimize for call cost, not deploy cost.
via_ir = false
# Pinned, not defaulted. solc's default EVM version moves with the compiler (0.8.30 targets
# a newer fork than 0.8.28 did), and a target the deployment chain has not adopted fails at
# broadcast rather than at compile time. Raise this deliberately, once Base has the fork.
evm_version = "cancun"

# `Deploy.s.sol` records the factory and implementation addresses here. Foundry sandboxes script
# filesystem access, so the one directory the script writes has to be granted explicitly.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[rpc_endpoints]
base-sepolia = "${RPC_URL}"

[etherscan]
base-sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
